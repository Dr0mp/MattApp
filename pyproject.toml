[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matte-app"
version = "0.1.0"
description = "A local desktop illustration matting app"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pymatting>=1.1.16",
    "PySide6>=6.7",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
birefnet = [
    "transformers>=4.45",
    "safetensors>=0.4",
    "accelerate>=1.0",
    "einops>=0.8",
    "kornia>=0.8",
    "timm>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["matte_app*"]

[tool.setuptools]
py-modules = ["ui_components", "ui_shell_layout"]

[tool.uv]
package = false
